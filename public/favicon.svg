<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Dark Obsidian Container with Glowing Emerald Border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#0C1210" stroke="#65F59A" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Top Mortarboard Cap -->
  <path
    d="M 16,4 L 27,9 L 16,14 L 5,9 Z M 16,6.5 L 9,9 L 16,11.5 L 23,9 Z"
    fill="#65F59A"
    fill-rule="evenodd"
  />

  <!-- Left Block Letter Q -->
  <path
    d="M 6.5,12 L 15,14 L 15,26 L 6.5,23 Z M 9,15 L 12.5,15.8 L 12.5,22.2 L 9,21.5 Z"
    fill="#65F59A"
    fill-rule="evenodd"
  />
  <!-- Q Tail -->
  <path d="M 11,20 L 14,24 L 15.5,26.5" stroke="#F2F7F3" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Block Letter D -->
  <path
    d="M 17,14 L 25.5,12 L 25.5,23 L 17,26 Z M 19.5,15.8 L 23,15 L 23,21.5 L 19.5,22.2 Z"
    fill="#38D9B0"
    fill-rule="evenodd"
  />

  <!-- Center Seam -->
  <line x1="16" y1="14" x2="16" y2="27" stroke="#F2F7F3" stroke-width="0.8" stroke-opacity="0.8" />
</svg>
