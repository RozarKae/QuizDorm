<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" fill="none">
  <defs>
    <!-- Soft Drop Shadow Filter for 3D Depth -->
    <filter id="icon-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    /* Default: Dark Theme */
    .icon-bg { fill: #0C1210; stroke: #65F59A; stroke-opacity: 0.4; }
    .icon-inner-border { stroke: #38D9B0; stroke-opacity: 0.2; }
    .icon-cap-top { fill: #FFFFFF; stroke: #65F59A; stroke-opacity: 0.9; }
    .icon-cap-bevel-left { fill: #38D9B0; }
    .icon-cap-bevel-right { fill: #1F8A68; }
    .icon-cap-accent { stroke: #FFFFFF; stroke-opacity: 0.95; }
    .icon-cap-accent-right { stroke: #65F59A; stroke-opacity: 0.85; }
    .icon-q-face { fill: #65F59A; }
    .icon-q-inner { fill: #08100C; stroke: #1A3D2E; }
    .icon-q-tail { fill: #FFFFFF; }
    .icon-d-face { fill: #38D9B0; }
    .icon-d-inner { fill: #08100C; stroke: #1A3D2E; }
    .icon-d-highlight { stroke: #65F59A; stroke-opacity: 0.7; }
    .icon-crevice { stroke: #060B08; stroke-opacity: 0.9; }
    .icon-crevice-line { stroke: #F2F7F3; stroke-opacity: 0.9; }

    /* Light Theme Inversion: White -> Dark Grey (#1E293B), Light Green -> Dark Green (#047857) */
    @media (prefers-color-scheme: light) {
      .icon-bg { fill: #FFFFFF; stroke: #047857; stroke-opacity: 0.5; }
      .icon-inner-border { stroke: #0D9488; stroke-opacity: 0.25; }
      .icon-cap-top { fill: #1E293B; stroke: #047857; stroke-opacity: 0.9; }
      .icon-cap-bevel-left { fill: #0D9488; }
      .icon-cap-bevel-right { fill: #047857; }
      .icon-cap-accent { stroke: #1E293B; stroke-opacity: 0.95; }
      .icon-cap-accent-right { stroke: #047857; stroke-opacity: 0.85; }
      .icon-q-face { fill: #047857; }
      .icon-q-inner { fill: #F1F5F9; stroke: #CBD5E1; }
      .icon-q-tail { fill: #1E293B; }
      .icon-d-face { fill: #0D9488; }
      .icon-d-inner { fill: #F1F5F9; stroke: #CBD5E1; }
      .icon-d-highlight { stroke: #047857; stroke-opacity: 0.8; }
      .icon-crevice { stroke: #E2E8F0; stroke-opacity: 0.9; }
      .icon-crevice-line { stroke: #047857; stroke-opacity: 0.9; }
    }
  </style>

  <!-- Container Base with Rounded Bezel -->
  <rect class="icon-bg" x="30" y="30" width="940" height="940" rx="220" stroke-width="6" />
  <rect class="icon-inner-border" x="50" y="50" width="900" height="900" rx="200" fill="none" stroke-width="2" />

  <!-- 3D CUBE LETTERS & CAP GROUP -->
  <g filter="url(#icon-drop-shadow)">
    <!-- --- LEFT BLOCK: LETTER Q --- -->
    <!-- Q Outer 3D Body -->
    <path class="icon-q-face" d="M 330,410 L 498,454 L 498,710 L 468,746 L 350,670 C 300,640 282,605 282,545 L 282,455 C 282,425 300,410 330,410 Z" />

    <!-- Q Inner Cutout Window -->
    <path class="icon-q-inner" d="M 360,480 L 435,498 L 435,595 L 360,575 C 342,570 335,560 335,540 L 335,510 C 335,490 342,480 360,480 Z" stroke-width="4" />

    <!-- Q Diagonal 3D Tail Inside -->
    <path class="icon-q-tail" d="M 382,560 L 440,618 L 415,640 L 365,585 Z" />
    <!-- Outer Tail Spike -->
    <path class="icon-q-face" d="M 435,660 L 498,710 L 468,746 L 435,705 Z" stroke-width="1" />

    <!-- --- RIGHT BLOCK: LETTER D --- -->
    <!-- D Outer 3D Body -->
    <path class="icon-d-face" d="M 512,454 L 640,418 C 695,402 735,445 735,505 L 735,585 C 735,645 690,695 625,715 L 512,746 Z" />

    <!-- D Inner Cutout Window -->
    <path class="icon-d-inner" d="M 570,485 L 635,470 C 665,470 680,490 680,535 L 680,595 C 680,635 660,655 630,665 L 570,685 Z" stroke-width="4" />

    <!-- D Inner Rim Highlight -->
    <path class="icon-d-highlight" d="M 570,485 L 570,685" stroke-width="5" />

    <!-- Center Crevice Seam -->
    <line class="icon-crevice" x1="505" y1="454" x2="505" y2="746" stroke-width="8" />
    <line class="icon-crevice-line" x1="501" y1="454" x2="501" y2="710" stroke-width="2.5" />

    <!-- --- TOP MORTARBOARD CAP --- -->
    <!-- Cap Downward Bevel Extrusions -->
    <path class="icon-cap-bevel-left" d="M 225,342 L 500,460 L 500,488 L 225,370 Z" />
    <path class="icon-cap-bevel-right" d="M 500,460 L 775,342 L 775,370 L 500,488 Z" />

    <!-- Top Cap Diamond Surface with Cutout -->
    <path class="icon-cap-top" d="M 500,225 L 775,342 L 500,460 L 225,342 Z M 500,275 L 310,342 L 500,410 L 690,342 Z" fill-rule="evenodd" stroke-width="3" />

    <!-- Specular Highlight Ridge Lines on Cap -->
    <path class="icon-cap-accent" d="M 225,342 L 500,460" stroke-width="4" />
    <path class="icon-cap-accent-right" d="M 500,460 L 775,342" stroke-width="2.5" />
    <path class="icon-cap-accent" d="M 500,225 L 225,342" stroke-width="3.5" />
  </g>
</svg>
